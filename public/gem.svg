<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 150" width="100" height="150">
  <defs>
    <linearGradient id="gTable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8bdff"/>
      <stop offset="0.45" stop-color="#8b4ae8"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="gUL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98cff"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gUR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#2e0a5e"/>
    </linearGradient>
    <linearGradient id="gPav" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a66cf5"/>
      <stop offset="1" stop-color="#3b0d78"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- crown -->
  <polygon points="50,3 50,24 30,50 5,58" fill="url(#gUL)"/>
  <polygon points="50,3 95,58 70,50 50,24" fill="url(#gUR)"/>
  <polygon points="50,24 70,50 30,50" fill="url(#gTable)"/>
  <polygon points="5,58 30,50 50,58" fill="#6d28d9"/>
  <polygon points="30,50 70,50 50,58" fill="#5b21b6"/>
  <polygon points="70,50 95,58 50,58" fill="#36106f"/>
  <!-- pavilion -->
  <polygon points="5,58 27,58 50,147" fill="#5a1caf"/>
  <polygon points="27,58 50,58 50,147" fill="url(#gPav)"/>
  <polygon points="50,58 73,58 50,147" fill="#330a68"/>
  <polygon points="73,58 95,58 50,147" fill="#1c0438"/>
  <!-- internal reflections -->
  <polygon points="31,62 45,62 50,128" fill="#c4a0ff" opacity="0.35"/>
  <polygon points="58,62 68,62 51,120" fill="#7c3aed" opacity="0.35"/>
  <!-- facet edges -->
  <g fill="none" stroke="#f3e8ff" stroke-opacity="0.28" stroke-width="0.9" stroke-linejoin="round">
    <path d="M50 3 L50 24 L30 50 L5 58 M50 24 L70 50 L95 58 M30 50 L70 50 M30 50 L50 58 L70 50 M5 58 L95 58 M27 58 L50 147 M50 58 L50 147 M73 58 L50 147"/>
  </g>
  <!-- outline + lit edge -->
  <polygon points="50,3 95,58 50,147 5,58" fill="none" stroke="#ead9ff" stroke-opacity="0.6" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M50 4 L7 57" stroke="#fff" stroke-opacity="0.8" stroke-width="1.6" stroke-linecap="round"/>
  <!-- sparkle -->
  <circle cx="36" cy="30" r="9" fill="url(#gGlow)" opacity="0.55"/>
  <path d="M36 19 L38 28 L47 30 L38 32 L36 41 L34 32 L25 30 L34 28 Z" fill="#fff"/>
  <circle cx="58" cy="40" r="1.6" fill="#fff" opacity="0.8"/>
</svg>
